version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lab5_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lab5_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    container_name: lab5_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: people_counting
    ports:
      - "5432:5432"
    volumes:
      - lab5_postgres_data:/var/lib/postgresql/data

  storage-server:
    build: ./storage-server
    container_name: lab5_storage_server
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/people_counting

  processing-server:
    build: ./processing-server
    container_name: lab5_processing_server
    depends_on:
      - kafka
      - storage-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STORAGE_SERVER_URL: http://storage-server:8000
    volumes:
      - ./output:/app/output

  camera-server:
    build: ./camera-server
    container_name: lab5_camera_server
    depends_on:
      - kafka
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VIDEO_PATH: /app/data/video.mp4

volumes:
  lab5_postgres_data: